name: CD

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: CI
    # The reusable workflow also declares the PR-only coverage comment job.
    permissions:
      actions: read
      contents: read
      pull-requests: write
    uses: ./.github/workflows/validate.yml

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
