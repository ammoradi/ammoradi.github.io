name: Validate and deploy portfolio

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Publish coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from 'node:fs'

          const { total } = JSON.parse(readFileSync('coverage/coverage-summary.json', 'utf8'))
          console.log('## Vitest coverage\n\n| Metric | Covered | Total | Coverage |\n| --- | ---: | ---: | ---: |')
          for (const metric of ['lines', 'branches', 'functions', 'statements']) {
            const { covered, total: count, pct } = total[metric]
            console.log(`| ${metric} | ${covered} | ${count} | ${pct}% |`)
          }
          NODE

      - name: Upload HTML coverage report
        if: ${{ !cancelled() && hashFiles('coverage/index.html') != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: vitest-coverage-${{ github.run_attempt }}
          path: coverage/

  coverage-comment:
    if: >-
      !cancelled() && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.id == github.event.repository.id
    needs: unit-test
    permissions:
      actions: read
      pull-requests: write
    uses: ./.github/workflows/coverage-comment.yml

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portfolio
        run: npm run build

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [build, unit-test]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
